ere cleaned and analysed, with uncertain values retained through explicit quality flags.\",\"zh\":\"超过 120 万条 iOS 应用记录经过清洗与分析，不确定值通过明确的数据质量标记予以保留。\"},\"repo\":\"https://github.com/stevenjobs530-afk/Apple-App-Store-Data-Cleaning-Analysis\",\"stats\":[{\"value\":\"1,229,886\",\"label\":{\"en\":\"Analysis-ready apps\",\"zh\":\"可分析应用记录\"}},{\"value\":\"1,127,384\",\"label\":{\"en\":\"Free apps identified\",\"zh\":\"识别免费应用\"}},{\"value\":\"193,328\",\"label\":{\"en\":\"Games category apps\",\"zh\":\"游戏类应用\"}}],\"overview\":{\"en\":\"SQLite, SQL and Python organise the large public App Store dataset into a documented structure for analysis. Suspicious values are recorded with quality flags rather than silently corrected, keeping them visible for later review.\",\"zh\":\"该项目使用 SQLite、SQL 和 Python，将大规模公开 App Store 数据整理为有记录、可分析的结构。可疑值不被直接修改，而是通过数据质量标记予以保留，便于后续核对。\"},\"challenge\":{\"en\":\"The dataset combines text, numeric, boolean and timestamp fields at a scale that makes manual review impractical. Consistent rules are therefore required for missing links, invalid timestamps, pricing mismatches, non-positive file sizes and duplicate identifiers.\",\"zh\":\"数据集包含文本、数值、布尔值和时间戳等多种字段，数据量较大，无法逐条人工检查。因此，需要为缺失链接、无效时间戳、定价不一致、非正数文件大小和重复编号制定统一规则。\"},\"methods\":[{\"title\":{\"en\":\"Standardise\",\"zh\":\"标准化\"},\"copy\":{\"en\":\"Clean text, convert numeric fields, normalise boolean values and parse timestamps to UTC.\",\"zh\":\"清理文本、转换数值字段、统一布尔值，并将时间戳解析为 UTC。\"}},{\"title\":{\"en\":\"Deduplicate\",\"zh\":\"去重\"},\"copy\":{\"en\":\"Remove exact duplicates and keep the most recently updated record when an App_Id appears more than once.\",\"zh\":\"移除完全重复的记录；当 App_Id 重复时，保留最近更新的记录。\"}},{\"title\":{\"en\":\"Record issues\",\"zh\":\"记录问题\"},\"copy\":{\"en\":\"Create Issue_* fields and a Quality_Issue_Count rather than making assumptions about ambiguous values.\",\"zh\":\"建立 Issue_* 字段和 Quality_Issue_Count，避免对含义不明确的数值作主观判断。\"}},{\"title\":{\"en\":\"Check outputs\",\"zh\":\"核对结果\"},\"copy\":{\"en\":\"Export CSV and SQLite outputs, then check counts, identifiers, flags and pricing logic in SQL.\",\"zh\":\"导出 CSV 和 SQLite 结果，并使用 SQL 核对行数、标识符、问题标记和定价逻辑。\"}}],\"codeTitle\":{\"en\":\"Recording data quality issues explicitly\",\"zh\":\"明确记录数据质量问题\"},\"codeFile\":\"src/clean_apple_appstore_dataset.py\",\"codeLang\":\"Python\",\"code\":\"df[\\\"Free_By_Price\\\"] = df[\\\"Price\\\"].fillna(0).eq(0)\\ndf[\\\"Issue_Missing_Price\\\"] = df[\\\"Price\\\"].isna()\\ndf[\\\"Issue_Price_Logic_Mismatch\\\"] = (\\n    df[\\\"Free\\\"].eq(False) \u0026 df[\\\"Price\\\"].fillna(0).eq(0)\\n)\\nissue_columns = [c for c in df.columns if c.startswith(\\\"Issue_\\\")]\\ndf[\\\"Quality_Issue_Count\\\"] = df[issue_columns].sum(axis=1)\",\"decisions\":[{\"en\":\"Uncertain records are retained and marked rather than filled with assumed values.\",\"zh\":\"不确定记录被保留并标记，不使用假设值进行填补。\"},{\"en\":\"Free_By_Price is derived from the numeric price while the original Free field remains available for comparison.\",\"zh\":\"Free_By_Price 根据数值价格推导，同时保留原始 Free 字段用于对比。\"},{\"en\":\"The most recently updated record is kept when an App_Id is duplicated.\",\"zh\":\"当 App_Id 重复时，保留最近更新的记录。\"},{\"en\":\"Reproducible file paths are documented while large raw and processed datasets remain outside the repository.\",\"zh\":\"可复现的文件路径均有记录，大型原始数据和处理后数据不提交到代码仓库。\"}],\"outcomes\":[{\"en\":\"The analysis-ready table contains 1,229,886 apps.\",\"zh\":\"可分析数据表包含 1,229,886 个应用。\"},{\"en\":\"The cleaned data contains 1,127,384 free apps and 102,502 paid apps.\",\"zh\":\"清洗后的数据包含 1,127,384 个免费应用和 102,502 个付费应用。\"},{\"en\":\"Games is the largest category, with reusable category and pricing summaries available for further analysis.\",\"zh\":\"游戏是数量最多的类别，并形成可重复使用的类别与定价汇总。\"}],\"next\":\"early-career-wellbeing\"},\"next\":{\"no\":\"03\",\"slug\":\"early-career-wellbeing\",\"label\":{\"en\":\"Case study 03 · Applied research · Supabase · RLS\",\"zh\":\"案例研究 03 · 应用研究 · Supabase · RLS\"},\"title\":{\"en\":\"Early-Career Wellbeing Study\",\"zh\":\"职场新人福祉研究\"},\"intro\":{\"en\":\"The University of Bristol AEP includes an online questionnaire with participant routing, submission validation and protected response storage.\",\"zh\":\"布里斯托大学 AEP 项目包含一份在线问卷，具备参与者分流、提交验证和受保护的回答存储。\"},\"repo\":\"https://github.com/stevenjobs530-afk/AEP-Workplace-Wellbeing-Questionnaire-Formal\",\"live\":\"https://stevenjobs530-afk.github.io/AEP-Workplace-Wellbeing-Questionnaire-Formal/\",\"stats\":[{\"value\":\"3\",\"label\":{\"en\":\"Participant routes\",\"zh\":\"参与者路径\"}},{\"value\":\"7\",\"label\":{\"en\":\"Guided stages\",\"zh\":\"引导式问卷阶段\"}},{\"value\":\"RLS\",\"label\":{\"en\":\"Protected response storage\",\"zh\":\"受保护的回答存储\"}}],\"overview\":{\"en\":\"This University of Bristol applied research project focuses on early-career transition and workplace wellbeing. The public questionnaire connects to a dedicated Supabase backend that checks each submission, separates formal research data and supports controlled export for analysis.\",\"zh\":\"这项布里斯托大学应用研究项目关注职场新人从教育到就业的过渡，以及工作场所福祉。公开问卷连接至独立的 Supabase 后端，用于检查每次提交、区分正式研究数据，并支持受控导出。\"},\"challenge\":{\"en\":\"The public form needed to adapt to different participant situations without allowing browser clients to read the response table. Consent, questionnaire version, routing, selection limits and score ranges all required checks before storage.\",\"zh\":\"公开表单需要根据不同参与者情况进行分流，同时避免浏览器客户端直接读取回答数据表。参与者同意、问卷版本、路径分流、多选限制和评分范围都需要在存储前完成检查。\"},\"methods\":[{\"title\":{\"en\":\"Route\",\"zh\":\"分流\"},\"copy\":{\"en\":\"Direct students and recent graduates to B1, early-career professionals to B2 and other visitors to an open-response route.\",\"zh\":\"将学生和应届毕业生引导至 B1，将职场新人引导至 B2，其他访问者进入开放回答路径。\"}},{\"title\":{\"en\":\"Validate\",\"zh\":\"验证\"},\"copy\":{\"en\":\"Check request origin, mode, consent, UUIDs, allowed options, route consistency, score ranges and request size.\",\"zh\":\"检查请求来源、模式、同意状态、UUID、允许选项、路径一致性、评分范围和请求大小。\"}},{\"title\":{\"en\":\"Protect\",\"zh\":\"保护\"},\"copy\":{\"en\":\"Block browser access to the response table and allow the public page to submit only through the server function.\",\"zh\":\"阻止浏览器直接访问回答数据表，公开页面只能通过服务器函数提交。\"}},{\"title\":{\"en\":\"Export\",\"zh\":\"导出\"},\"copy\":{\"en\":\"Separate test and formal modes, then add a flattened export and integrity checks for later analysis.\",\"zh\":\"区分测试与正式模式，并增加扁平化导出和完整性检查，用于后续分析。\"}}],\"codeTitle\":{\"en\":\"Checking questionnaire routes on the server\",\"zh\":\"在服务器端检查问卷分流\"},\"codeFile\":\"supabase/functions/submit-aep-questionnaire/index.ts\",\"codeLang\":\"TypeScript\",\"code\":\"function expectedRoute(situation: string) {\\n  if (situation === \\\"student\\\" || situation === \\\"recent\\\") return \\\"b1\\\";\\n  if (situation === \\\"professional\\\") return \\\"b2\\\";\\n  return \\\"open\\\";\\n}\\n\\nif (payload.consented !== true) throw new Error(\\\"CONSENT_REQUIRED\\\");\\nif (payload.route !== expectedRoute(payload.situation as string)) {\\n  throw new Error(\\\"INVALID_ROUTE\\\");\\n}\",\"decisions\":[{\"en\":\"The questionnaire page remains public while browser clients cannot read response data.\",\"zh\":\"问卷页面保持公开，同时浏览器客户端无法读取回答数据。\"},{\"en\":\"Questionnaire rules are checked on the server rather than through hidden or disabled form controls.\",\"zh\":\"问卷规则在服务器端完成检查，不依赖隐藏或禁用的表单控件。\"},{\"en\":\"The questionnaire and data structure share a version so that later analysis can be traced to the correct form.\",\"zh\":\"问卷与数据结构采用对应版本，以便后续分析能够追溯至正确表单。\"},{\"en\":\"Only the interface and technical structure appear in the portfolio; no participant responses are displayed.\",\"zh\":\"作品集只展示界面和技术结构，不展示任何参与者回答。\"}],\"outcomes\":[{\"en\":\"A seven-stage questionnaire supports routes for different participant situations.\",\"zh\":\"七阶段问卷支持根据不同参与者情况进行分流。\"},{\"en\":\"An Edge Function checks submissions, while RLS protects stored responses.\",\"zh\":\"Edge Function 用于检查提交内容，RLS 用于保护已存储的回答。\"},{\"en\":\"Export SQL and pre-export integrity checks support later research analysis.\",\"zh\":\"导出 SQL 和导出前完整性检查用于支持后续研究分析。\"}],\"next\":\"uk-retail\"}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"10:I[6869,[],\"IconMark\"]\n7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"Website update in progress · 网站正在更新\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The website is being updated. 网站正在更新中，请稍后再来查看。\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Zishun Gao — Portfolio Version 3\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Education, data projects, research and early professional experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:image\",\"content\":\"https://stevenjobs530-afk.github.io/portfolio-v3-public/og-v2.png\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image:alt\",\"content\":\"Zishun Gao portfolio\"}],[\"$\",\"meta\",\"8\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:title\",\"content\":\"Zishun Gao — Portfolio Version 3\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:description\",\"content\":\"Education, data projects, research and early professional experience.\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:image\",\"content\":\"https://stevenjobs530-afk.github.io/portfolio-v3-public/og-v2.png\"}],[\"$\",\"link\",\"12\",{\"rel\":\"shortcut icon\",\"href\":\"/portfolio-v3-public/favicon.svg\"}],[\"$\",\"link\",\"13\",{\"rel\":\"icon\",\"href\":\"/portfolio-v3-public/favicon.svg\"}],[\"$\",\"$L10\",\"14\",{}]]\n"])</script></body></html>
